async function unlock(){
  const msg=document.getElementById('msg'), btn=document.getElementById('go');
  msg.textContent=''; btn.disabled=true; btn.textContent='Decrypting...';
  try{
    const pw=document.getElementById('pw').value;
    const base=await crypto.subtle.importKey('raw', te.encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:SALT,iterations:ITER,hash:'SHA-256'}, base, {name:'AES-GCM',length:256}, false, ['decrypt']);

    document.open();
    document.write(html);
    document.close();
  }catch(e){
    msg.textContent='Wrong password (or corrupted file). Try again.';
    btn.disabled=false; btn.textContent='Unlock';
  }
}
